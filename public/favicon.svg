<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040d24" />
      <stop offset="100%" stop-color="#010308" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="20" y1="85" x2="95" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Night Shield -->
  <polygon
    points="60,6 108,33 108,87 60,114 12,87 12,33"
    fill="url(#bgGrad)"
    stroke="url(#bladeGrad)"
    stroke-width="3.5"
  />

  <!-- Inner Precision Ring -->
  <polygon
    points="60,14 100,37 100,83 60,106 20,83 20,37"
    fill="none"
    stroke="#60a5fa"
    stroke-opacity="0.28"
    stroke-width="1.2"
    stroke-dasharray="6 4"
  />

  <!-- Custom Interlocking Geometric 'P' and 'S' Monogram -->
  <g filter="url(#glow)">
    <!-- Vertical Spine & Upper Loop of P -->
    <path
      d="M36 86 V34 H66 C76 34 82 40 82 48.5 C82 57 76 63 66 63 H48"
      stroke="url(#bladeGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Interlocking Lower S Curve -->
    <path
      d="M78 49 H56 C49 49 45 53 45 58.5 C45 64 49 67.5 57 68.5 L69 70 C78 71 83 75.5 83 82 C83 89.5 76 94 64 94 H36"
      stroke="url(#accentGlow)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Starlight North Star Spark at Apex -->
    <circle cx="60" cy="22" r="2.8" fill="#e0f2fe" />
  </g>
</svg>
